<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Career Simulator</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <!-- Подключаем спортивный шрифт Teko и пропный Montserrat -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&family=Teko:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Шапка с балансом и статусом -->
        <header class="top-bar">
            <div class="user-info">
                <span id="user-name">Загрузка...</span>
            </div>
            <div class="currency">
                <span class="coin-icon">🪙</span>
                <span id="balance-val">1,000</span>
            </div>
        </header>

        <!-- Главная карточка игрока (FUT Style) -->
        <main class="card-section">
            <div class="fut-card gold-card">
                <div class="card-inner">
                    <div class="card-top">
                        <div class="rating-box">
                            <span class="ovr-rating" id="player-ovr">68</span>
                            <span class="position">ST</span>
                        </div>
                        <div class="nation-flag">🇷🇺</div>
                    </div>
                    
                    <div class="player-avatar">
                        <!-- Векторная графика футболиста в форме -->
                        <svg viewBox="0 0 100 100" class="avatar-svg">
                            <path d="M50,20 C40,20 35,28 35,38 C35,48 40,52 50,52 C60,52 65,48 65,38 C65,28 60,20 50,20 Z" fill="#E0AC69"/>
                            <path d="M25,55 C35,50 65,50 75,55 L85,85 L15,85 Z" fill="#00ff87"/>
                            <path d="M40,55 L60,55 L58,85 L42,85 Z" fill="#111"/>
                            <text x="50" y="72" fill="#fff" font-size="12" font-weight="bold" text-anchor="middle">9</text>
                        </svg>
                    </div>

                    <div class="player-details">
                        <h2 class="player-name" id="card-player-name">АМИРХАН</h2>
                        <div class="club-badge" id="player-club">Свободный агент</div>
                        <div class="card-divider"></div>
                        
                        <!-- Характеристики игрока -->
                        <div class="stats-grid">
                            <div class="stat-item"><span class="stat-val" id="st-pac">72</span><span class="stat-lbl">PAC</span></div>
                            <div class="stat-item"><span class="stat-val" id="st-sho">65</span><span class="stat-lbl">SHO</span></div>
                            <div class="stat-item"><span class="stat-val" id="st-pas">60</span><span class="stat-lbl">PAS</span></div>
                            <div class="stat-item"><span class="stat-val" id="st-dri">70</span><span class="stat-lbl">DRI</span></div>
                            <div class="stat-item"><span class="stat-val" id="st-def">35</span><span class="stat-lbl">DEF</span></div>
                            <div class="stat-item"><span class="stat-val" id="st-phy">68</span><span class="stat-lbl">PHY</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Кастомизация Экипировки -->
        <section class="equipment-section">
            <h3>Экипировка & Снаряжение</h3>
            <div class="equip-grid">
                <div class="equip-slot active">
                    <svg class="equip-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M21 6h-4.18C16.4 4.24 14.82 3 13 3h-2c-1.82 0-3.4 1.24-3.82 3H3L2 12h4v9h12v-9h4L21 6z"/></svg>
                    <span>Форма #9</span>
                </div>
<div class="equip-slot">
                    <svg class="equip-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 23h2.1l1.8-8 2.1 2v6h2v-7.5l-2.1-2 .6-3C14.8 12 16.8 13 19 13v-2c-1.9 0-3.5-1-4.3-2.4l-1-1.6c-.4-.6-1-1-1.7-1-.3 0-.5.1-.8.1L6 8.3V13h2V9.8l1.8-.9z"/></svg>
                    <span>Бутсы +2 PAC</span>
                </div>
                <div class="equip-slot locked">
                    <span class="lock-icon">🔒</span>
                    <span>Капитанка</span>
                </div>
            </div>
        </section>

        <!-- Меню Действий -->
        <footer class="action-bar">
            <button class="btn btn-primary" onclick="trainPlayer()">
                <svg class="btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 6.29 3.43 4.86 2 3.43 3.43 2 4.86 3.43 6.29 2 7.71 3.43 9.14 2 10.57 3.43 12 7 20.57 15.57 17 12 20.57 13.43 22 14.86 20.57z"/></svg>
                Тренировка
            </button>
            <button class="btn btn-accent" onclick="playMatch()">
                <svg class="btn-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                Матч
            </button>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
