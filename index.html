<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FC Career Manager</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Верхняя панель -->
        <header class="top-bar">
            <div class="profile-info">
                <span class="user-level">LVL 12</span>
                <span id="user-name">АМИРХАН</span>
            </div>
            <div class="balance-badge">
                <span class="coin-icon">⚡</span>
                <span id="balance-val">15,000</span>
            </div>
        </header>

        <!-- FUT-карточка -->
        <div class="card-wrapper">
            <div class="fut-card gold-theme">
                <div class="card-bg-overlay"></div>
                
                <div class="card-header">
                    <div class="rating-group">
                        <span class="ovr-num" id="player-ovr">88</span>
                        <span class="pos-tag">ST</span>
                    </div>
                    <div class="club-and-flag">
                        <span class="flag">🇷🇺 </span>
                    </div>
                </div>

                <!-- Вырезанное реалистичное фото вместо детского SVG -->
                <div class="player-photo-container">
                    <img src="https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=500&auto=format&fit=crop&q=60" alt="Player" class="player-photo">
                </div>

                <div class="card-footer">
                    <h2 class="player-title" id="card-player-name">AMIRHAN</h2>
                    <div class="club-name">СВОБОДНЫЙ АГЕНТ</div>
                    <div class="divider"></div>

                    <!-- Статы -->
                    <div class="stats-matrix">
                        <div class="stat-box"><span class="val">89</span><span class="lbl">PAC</span></div>
                        <div class="stat-box"><span class="val">86</span><span class="lbl">SHO</span></div>
                        <div class="stat-box"><span class="val">78</span><span class="lbl">PAS</span></div>
                        <div class="stat-box"><span class="val">88</span><span class="lbl">DRI</span></div>
                        <div class="stat-box"><span class="val">42</span><span class="lbl">DEF</span></div>
                        <div class="stat-box"><span class="val">82</span><span class="lbl">PHY</span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Экипировка -->
        <section class="gear-section">
            <div class="section-title">СНАРЯЖЕНИЕ</div>
            <div class="gear-row">
                <div class="gear-card active">
                    <div class="gear-icon">👕 </div>
                    <div class="gear-text">Форма Pro</div>
                </div>
                <div class="gear-card">
                    <div class="gear-icon">👟 </div>
                    <div class="gear-text">Mercurial +3 PAC</div>
                </div>
                <div class="gear-card locked">
                    <div class="gear-icon">🔒</div>
                    <div class="gear-text">Капитанка</div>
                </div>
            </div>
        </section>

        <!-- Нижние кнопки -->
        <footer class="bottom-actions">
            <button class="action-btn train-btn" onclick="trainPlayer()">ТРЕНИРОВКА</button>
            <button class="action-btn match-btn" onclick="playMatch()">ИГРАТЬ МАТЧ</button>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
